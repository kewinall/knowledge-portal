<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Public knowledge portal generated from approved artifacts.">
  <title>Knowledge Portal</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f7f7f8;
      --panel: #ffffff;
      --text: #18181b;
      --muted: #71717a;
      --line: #e4e4e7;
      --accent: #2563eb;
      --chip: #f4f4f5;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #09090b;
        --panel: #18181b;
        --text: #f4f4f5;
        --muted: #a1a1aa;
        --line: #27272a;
        --accent: #60a5fa;
        --chip: #27272a;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont,
                   "Segoe UI", "Noto Sans TC", sans-serif;
    }
    main {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 56px 0 80px;
    }
    header { display: grid; gap: 12px; margin-bottom: 32px; }
    h1 {
      margin: 0;
      font-size: clamp(2rem, 5vw, 3.5rem);
      letter-spacing: -0.04em;
    }
    .lead { margin: 0; color: var(--muted); }
    .toolbar { display: grid; gap: 14px; margin: 28px 0 22px; }
    input[type="search"] {
      width: 100%;
      padding: 14px 16px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--panel);
      color: var(--text);
      font: inherit;
    }
    .filters { display: flex; gap: 8px; flex-wrap: wrap; }
    .filter {
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--text);
      padding: 8px 12px;
      border-radius: 999px;
      cursor: pointer;
    }
    .filter.active { border-color: var(--accent); color: var(--accent); }
    .meta { color: var(--muted); font-size: .92rem; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 16px;
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 20px;
      min-height: 180px;
    }
    .card-top {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      color: var(--muted);
      font-size: .84rem;
    }
    .category { font-weight: 650; color: var(--accent); }
    h2 { margin: 14px 0 8px; font-size: 1.15rem; line-height: 1.35; }
    h2 a { color: var(--text); text-decoration: none; }
    h2 a:hover { color: var(--accent); }
    .description { color: var(--muted); line-height: 1.6; }
    .tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 14px; }
    .tag {
      padding: 4px 8px;
      background: var(--chip);
      border-radius: 999px;
      color: var(--muted);
      font-size: .78rem;
    }
    .empty {
      padding: 24px;
      border: 1px dashed var(--line);
      border-radius: 12px;
      color: var(--muted);
    }
    footer { margin-top: 40px; color: var(--muted); font-size: .82rem; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Knowledge Portal</h1>
      <p class="lead">已核准公開的工作成果、工程知識、旅遊與生活文件。</p>
    </header>

    <section class="toolbar" aria-label="搜尋與分類">
      <input id="search" type="search"
             placeholder="搜尋標題、說明、分類或標籤…" autocomplete="off">
      <div class="filters"><button class="filter active" type="button" data-category="all">全部</button><button class="filter" type="button" data-category="travel">旅遊</button></div>
      <div class="meta">
        <span id="visible-count">1</span> / 1 份文件
      </div>
    </section>

    
    <section class="grid" id="document-grid">
            <article class="card"
                     data-category="travel"
                     data-search="2027 北海道｜連假延伸・道東 10 天 9 夜 2027 台灣國定假日延伸的北海道 10 天 9 夜提案：含道東，自駕與大眾運輸版本、請假日期、路線地圖、季節風險及購物安排。 travel 旅遊 ">
              <div class="card-top">
                <span class="category">旅遊</span>
                <time datetime="2026-09-29">2026-09-29</time>
              </div>
              <h2><a href="travel/hokkaido-2027-holiday-guide.html">2027 北海道｜連假延伸・道東 10 天 9 夜</a></h2>
              <p class="description">2027 台灣國定假日延伸的北海道 10 天 9 夜提案：含道東，自駕與大眾運輸版本、請假日期、路線地圖、季節風險及購物安排。</p>
              <div class="tags"></div>
            </article>
            </section>

    <footer>
      此入口由 knowledge-workspace 自動產生；公開內容以 knowledge-portal 為準。
    </footer>
  </main>

  <script>
    const cards = [...document.querySelectorAll('.card')];
    const search = document.getElementById('search');
    const count = document.getElementById('visible-count');
    const buttons = [...document.querySelectorAll('.filter')];
    let activeCategory = 'all';

    function applyFilters() {
      const query = search.value.trim().toLowerCase();
      let visible = 0;
      cards.forEach(card => {
        const categoryMatch =
          activeCategory === 'all' || card.dataset.category === activeCategory;
        const searchMatch = !query || card.dataset.search.includes(query);
        const show = categoryMatch && searchMatch;
        card.hidden = !show;
        if (show) visible += 1;
      });
      count.textContent = visible;
    }

    search.addEventListener('input', applyFilters);
    buttons.forEach(button => {
      button.addEventListener('click', () => {
        activeCategory = button.dataset.category;
        buttons.forEach(
          item => item.classList.toggle('active', item === button)
        );
        applyFilters();
      });
    });
  </script>
</body>
</html>
